name: jjm_citizen_app
description: "Jal Jeevan Mission Citizen Feedback Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # SQLite Database & Path Utilities
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Network Detection
  connectivity_plus: ^6.0.3

  # Hardware Camera Access
  image_picker: ^1.1.2

  # Geolocation & GPS
  geolocator: ^12.0.0

  # HTTP Client for Multipart Requests
  http: ^1.2.1

  # Localization & Formatting
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true